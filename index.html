<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Team Toby</title>
<style>
:root{--bg:#f1f4f7;--surface:#fff;--ink:#142131;--muted:#566879;--line:#d5dde6;--head:#163f66;--head-ink:#f4f8fb;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0d141d;--surface:#141e2b;--ink:#e6edf4;--muted:#93a4b7;--line:#243245;--head:#0a2440;--head-ink:#eef4fa;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;padding:0 16px 48px}
header{margin:0 -16px;padding:18px 16px;background:var(--head);color:var(--head-ink)}
h1{max-width:560px;margin:0 auto;font:700 28px/1.05 "Arial Narrow",Arial,sans-serif}
main{max-width:560px;margin:20px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
p{margin:0 0 8px}.muted{color:var(--muted);font-size:14px;margin:0}
</style>
</head>
<body>
<header><h1>Team Toby</h1></header>
<main>
<p>This page is no longer used. The team now uses the Toby Samuel Tennis Hub, signing in with a Claude account.</p>
<p class="muted">Ask Richard for an invite if you don't have access.</p>
</main>
</body>
</html>
